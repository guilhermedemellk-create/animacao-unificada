name: "video_2d"
title: "Vídeo 2D — ScriptForge + GrowKaz Stickman"
description: "Comando 'use a skill 2d'. Faz o vídeo 2D inteiro do jeito que o usuário pedir, unindo as duas fontes enviadas por ele em 2026-11-07: (1) o PDF ScriptForge (2D_Niche_Prompt_for_Claude.pdf) — menu de nichos (Self-Improvement, Psychology, What If, Science, History), 10 ideias por subnicho e roteiro completo de narração de 3–4 min (450–600 palavras) com estrutura hook/setup/corpo/payoff/outro, estilo de narração por nicho, [NARRATION]/[VISUAL], títulos alternativos, texto de thumbnail e tags; (2) o plugin GrowKaz Stickman Studio (GrowKaz_Stickman.plugin) — vídeo stick-figure cinematográfico desenhado 100% por código (Canvas + Three.js, frame a frame em Chromium headless, sem IA de imagem/vídeo): narração com timestamps via Whisper, breakdown com bible/cast/shots.json, grade de 5 estilos (emerald, ember, arctic, sakura, retro), construção de cenas com rim light e câmera sempre em movimento, música/SFX gerados, mix a -14 LUFS, render e QA final, MP4 em 16:9 ou 9:16 de 720p a 4K. Fica apenas armazenada e só é usada quando ele mandar algo relacionado a 'use a skill 2d'; não aplicar por padrão a outros vídeos e projetos."
category: "Work and knowledge"
