description: "Enviada pelo usuário em 2026-11-08 no pacote de skills do PC dele (pasta 'E:\\skills muse', 4 zips, ~175 MB, 104 skills), instalada intacta. Crea un short animado para TikTok, YouTube o ambos con los personajes y la línea editorial del canal — propone el guion en diálogo para aprobar, entrega los textos para publicar, genera las voces de cada personaje con ElevenLabs (o usa el audio de la persona, o va sin voz) y exporta el MP4 sincronizado. También configura la línea editorial y los fondos (/nuevo-video editorial) y las voces (/nuevo-video voz). Úsalo cuando pidan un video nuevo, los textos de un video, cambiar el estilo de TikTok o YouTube, los fondos o las voces."
