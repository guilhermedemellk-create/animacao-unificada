name: "claude_animated_shorts"
title: "Claude Animated Shorts (cartoon-3d-short) — a skill ORIGINAL: cartoon 2D em mundo 3D via Remotion"
description: "Pacote enviado pelo usuário em 2026-11-08 (claude-animated-shorts-main_0_1buf.zip; MD5 88429d4971bf7491827b2fe361b379e9), estudado e instalado intacto em ~/workspace/custom-skills/claude-animated-shorts/ (SKILL.md + README + references/ + templates/, byte a byte). É a skill-fonte da qual a cartoon-audio-short deriva: faz shorts verticais de história de 55-70 s (1080x1920 a 30 fps, export final 2K 1440x2560 em --scale 1.3333) com personagens cartoon 2D 'bean-head' (biblioteca Pen em toon.ts, canvas 600x1000, contorno ameixa) dentro de mundo 3D colorido em three.js DENTRO DO REMOTION (React/TypeScript, composição registrada num projeto Remotion com @remotion/three): tinta preta como passe próprio antes do desfoque de lente, DOF, bloom, grade, câmeras por chaves em story.ts com reação 0-3 quadros antes da palavra. Prova: 'The Bridge That Fell for a Song' (67 s, ponte de Broughton 1831) — templates/bridge/ traz o CÓDIGO-FONTE COMPLETO desse short (world/build/paint/toon/cast/ink/lensblur/grade/lights/shade/cardshade/story/Bridge.tsx), templates/audio/ traz a síntese de som original (dsp.py e instruments.py BYTE-IDÊNTICOS aos do kit da cartoon-audio-short; sfx_gen.py idêntico; mais sfx.py, music.py com partitura de marcha, timeline.py e mix.py de 354 linhas COM ducking — padrão do autor: música +3 dB, SFX -6 dB, voz intacta) e templates/scripts/ traz bridge-stills.mjs, bridge_merge.py, bridge_shots.py, sbs_sheet.py e short_qa.py. references/ é o material de estudo de estilo medido de 20 shorts de referência: STYLE_BIBLE.md (fórmula de roteiro: gancho-paradoxo → cenário → escalada → pivô 'You see,' → analogia cotidiana → payoff irônico; ~3,7 palavras/s), 7 relatórios medidos (characters 728 linhas, textures 978, depth, lighting, outlines, grade, motion), 38 quadros 540x960 e 20 folhas de contato (1.200 quadros). REGRAS DO AUTOR (do SKILL.md original): sem legendas, inglês, voz em tom estável, export 2K, verificação por Opus max, props Kenney CC0 recoloridos (GLBs NÃO incluídos — public/ de ~1,3 GB fica de fora; world.ts tolera a ausência e renderiza a cidade procedural sem os props). ATENÇÃO PRÁTICA: exige um projeto Remotion próprio (não vem package.json nem scaffold no zip; REMOTION_TMP num disco grande porque cada bundle copia public/); renders 2K rodam a ~4 fps na máquina do autor. QUANDO USAR: quando ele pedir um vídeo 'igual ao do bridge/soldados', neste estilo cartoon 3D via Remotion, quiser o material de referência medido (STYLE_BIBLE/relatórios/quadros) ou os valores finais de look (luz day/golden, tinta, lente) — para os shorts guiados por narração do fluxo atual dele (Re:Zero, Saitama, Black Friday, Hulk), a engine em produção continua sendo a cartoon-audio-short (JS puro + Chromium headless, sem Remotion), que já embute esta biblioteca. Licença MIT (código e docs); quadros de referência só para estudo de estilo. Verificação nesta VM em 2026-11-08 registrada em ~/workspace/claude-animated-shorts-study/ESTUDO.md."
