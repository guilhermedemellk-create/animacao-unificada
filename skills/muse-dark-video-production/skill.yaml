title: "Muse Dark Video Production"
description: "Produção completa de vídeos narrativos sombrios para YouTube Shorts, TikTok e Reels, com estética cinematográfica vermelho/preto, suspense, silhuetas, tipografia cinética, glitch e áudio sincronizado. Fluxo obrigatório por fases (briefing, roteiro, storyboard, design visual, geração com teste 3-5s, narração TTS com texto limpo, música/SFX, edição, exportação), bíblia de personagens e continuidade, prompts por cena e QA obrigatório do arquivo exportado antes de declarar pronto."
