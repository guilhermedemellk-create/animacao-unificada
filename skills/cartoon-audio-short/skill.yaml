name: "cartoon_audio_short"
title: "Cartoon Audio Short — cartoon 2D em mundo 3D guiado pela voz"
description: "Skill enviada pelo usuário em 2026-11-07 (cartoon-audio-short111.zip; MD5 3c0f5dd2e34c89fbb79698688e758dc1), estudada e instalada intacta em ~/workspace/custom-skills/cartoon-audio-short/ (SKILL.md original + kit/ completo, byte a byte). Faz um short animado vertical 1080x1920 a 30 fps com duração EXATA da narração: personagens cartoon 2D 'bean-head' desenhados em Canvas (cards com contorno ameixa, biblioteca Pen/toonbase.js do claude-animated-shorts, MIT) dentro de um mundo 3D colorido em Three.js com contorno de tinta preta, texturas pintadas, profundidade de campo e câmeras que deslizam. Fluxo em 4 estágios: (1) intake — se já houver áudio de narração anexado, pula direto ao estágio 4; (2) exatamente 10 ideias (título, gancho paradoxal, twist, por que anima bem, fato ou lenda verificado); (3) roteiro só de narração a ~3,7 palavras/s (vozes graves/lentas ~2,6), fórmula gancho→contexto→escalada→pivô→twist final, + dicas de gravação; (4) construção sem parar: setup.sh copia a engine, timing.py alinha roteiro à voz SEM ASR (segmentos de silêncio + DP sílabas×duração; Whisper se houver), PLAN.md quadro a quadro (reação 0–3 quadros ANTES da palavra, frame 0 já é o gancho, mapa aéreo com rota tracejada para distâncias/antes-depois, beat triste sem piada), mundo em main.js/story.js (primitivas + texturas pintadas de paint.js, toon 2 passos, tinta só no lado próximo do salto de profundidade, DOF 48 taps), elenco em cast.js/castdefs.js (roupas por campos, poses de braço, expressões FACE, folha de teste obrigatória, depth pull dos cards 0,9 m em ação/0,3 m normal), motion.js (câmeras por chaves com smootherstep, nada parado 4+ quadros, idle/blink sempre, antecipação→overshoot→spring, walk com pés plantados), folha de stills ANTES do render longo, áudio 100% sintetizado (dsp/instruments/sfx_gen) com REGRA CENTRAL: música e SFX a exatos 50% da voz (−6 dB RMS gated) via mix.py, sem ducking; finish.sh = um ganho linear a ~−14 LUFS + limiter −1 dBFS, H.264 CRF 17 + AAC e QA de freeze/black/loudness. Voz do usuário NUNCA é editada nem re-temporizada — a imagem é que se ajusta a ela; sem legendas salvo pedido (texto diegético permitido, nunca espelhado); histórias/personagens sempre originais. Exemplo completo no kit: 'The Man Who Moved a Mountain' (41,8 s, 12 tomadas, PLAN + roteiro). VERIFICADO nesta VM em 2026-11-07: sintaxe Python/JS/Shell OK, setup.sh funcionou (three@0.160.0 + toon.js), render de 4 quadros do exemplo OK (~15 s/quadro em SwiftShader nesta VM — render longo deve ir pro PC dele, RTX 5060, pela regra do caminho mais rápido, avisando), mix mediu música a exatos −6,00 dB vs voz e finish a −14,07 LUFS. Usar quando ele pedir um short/cartoon animado neste estilo guiado por narração (ou citar 'cartoon-audio-short'); não substitui nem se aplica por padrão às outras linhas (stickman 2D/GrowKaz, VULTARIS, terror, 3D)."
